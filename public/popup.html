<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>右键查词工具设置</title>
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei UI", sans-serif;
      color-scheme: dark;
      --bg: #111114;
      --panel: #1a1a1f;
      --field: #222229;
      --field-hover: #292931;
      --text: #f3f3f5;
      --muted: #9a9aa4;
      --border: rgba(255,255,255,.10);
      --accent: #8b7cf6;
      --accent-soft: rgba(139,124,246,.15);
    }
    html[data-theme="light"] {
      color-scheme: light;
      --bg: #f4f4f7;
      --panel: #ffffff;
      --field: #f0f0f4;
      --field-hover: #e7e7ed;
      --text: #1d1d22;
      --muted: #71717a;
      --border: rgba(0,0,0,.10);
      --accent: #6657d9;
      --accent-soft: rgba(102,87,217,.10);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 430px;
      max-height: 650px;
      overflow-y: auto;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
    }
    main { padding: 16px; }
    h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: .01em;
    }
    .subtitle {
      margin: 4px 0 14px;
      color: var(--muted);
      font-size: 12px;
    }
    section {
      padding: 13px;
      margin: 0 0 10px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
    }
    h2 {
      margin: 0 0 11px;
      font-size: 14px;
    }
    label {
      display: block;
      margin: 9px 0 5px;
      color: var(--muted);
      font-size: 12px;
    }
    input, select, textarea, button {
      font: inherit;
    }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      padding: 8px 9px;
      background: var(--field);
      color: var(--text);
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }
    textarea {
      min-height: 118px;
      resize: vertical;
      line-height: 1.5;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }
    .switch-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .switch-row label {
      flex: 1;
      margin: 0;
      color: var(--text);
      font-size: 13px;
    }
    .switch-row input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }
    .note {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }
    .key-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 7px;
    }
    button {
      border: 0;
      border-radius: 8px;
      padding: 8px 11px;
      background: var(--field);
      color: var(--text);
      cursor: pointer;
    }
    button:hover { background: var(--field-hover); }
    .primary {
      width: 100%;
      background: var(--accent);
      color: white;
      font-weight: 700;
      padding: 10px;
    }
    .primary:hover { filter: brightness(1.06); background: var(--accent); }
    .footer-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }
    #status {
      flex: 1;
      min-height: 18px;
      color: var(--muted);
      font-size: 12px;
    }
    .small { padding: 7px 9px; }
  </style>
</head>
<body>
  <main>
    <h1>右键查词工具</h1>
    <div class="subtitle">划词即查 · 上下文理解 · 自定义大模型</div>

    <section>
      <div class="switch-row">
        <label for="autoLookup">自动查词总开关</label>
        <input id="autoLookup" type="checkbox" />
      </div>
      <p class="note">快捷键：Alt + Shift + L。关闭后所有网页暂停自动查词。</p>
    </section>

    <section>
      <h2>API 配置</h2>
      <label for="provider">模型平台</label>
      <select id="provider">
        <option value="deepseek">DeepSeek</option>
        <option value="zhipu">智谱 GLM</option>
        <option value="mimo">小米 MiMo</option>
        <option value="qwen">阿里云千问</option>
        <option value="custom">自定义 OpenAI-compatible</option>
      </select>
      <p id="providerNote" class="note"></p>

      <label for="apiKey">API Key</label>
      <div class="key-row">
        <input id="apiKey" type="password" autocomplete="off" placeholder="sk-..." />
        <button id="toggleKey" class="small" type="button">显示</button>
      </div>

      <label for="baseUrl">Base URL</label>
      <input id="baseUrl" type="url" spellcheck="false" placeholder="https://..." />

      <label for="model">模型名称</label>
      <input id="model" list="modelSuggestions" spellcheck="false" placeholder="模型 ID" />
      <datalist id="modelSuggestions"></datalist>
    </section>

    <section>
      <h2>界面设置</h2>
      <div class="row">
        <div>
          <label for="theme">UI 风格</label>
          <select id="theme">
            <option value="dark">黑夜</option>
            <option value="light">明亮</option>
            <option value="system">跟随系统</option>
          </select>
        </div>
        <div>
          <label for="fontSize">字体大小</label>
          <select id="fontSize">
            <option value="small">小</option>
            <option value="medium">中</option>
            <option value="large">大</option>
          </select>
        </div>
      </div>
    </section>

    <section>
      <h2>Prompt 自定义</h2>
      <label for="wordPrompt">单词 / 短词组 Prompt</label>
      <textarea id="wordPrompt"></textarea>

      <label for="sentencePrompt">句子 Prompt</label>
      <textarea id="sentencePrompt"></textarea>

      <div class="footer-row">
        <button id="resetPrompts" class="small" type="button">恢复默认 Prompt</button>
      </div>
      <p class="note">默认 Prompt 要求 UI 与主要解释使用中文，但“语境英文释义”必须保持英文。</p>
    </section>

    <button id="save" class="primary" type="button">保存设置</button>
    <div class="footer-row">
      <span id="status" role="status"></span>
    </div>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
