<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>PDF 查词阅读器</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei UI",sans-serif;color-scheme:dark;--bg:#0f0f12;--panel:#18181d;--field:#24242b;--text:#f2f2f4;--muted:#9696a0;--border:rgba(255,255,255,.12);--accent:#8b7cf6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}.toolbar{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:minmax(180px,1fr) auto auto auto;gap:8px;align-items:center;padding:10px 14px;background:rgba(18,18,22,.96);border-bottom:1px solid var(--border);backdrop-filter:blur(14px)}input,button{font:inherit;border:0;border-radius:8px;padding:9px 11px}input{background:var(--field);color:var(--text);outline:1px solid var(--border)}button{background:var(--field);color:var(--text);cursor:pointer}.status{grid-column:1/-1;color:var(--muted);font-size:12px}.pages{display:flex;flex-direction:column;align-items:center;gap:18px;padding:22px}.page{position:relative;background:#fff;box-shadow:0 12px 32px rgba(0,0,0,.4);--total-scale-factor:1}.page canvas{display:block}.pdf-text-layer{color-scheme:only light;position:absolute;text-align:initial;inset:0;overflow:clip;opacity:1;line-height:1;letter-spacing:normal;word-spacing:normal;-webkit-text-size-adjust:none;text-size-adjust:none;forced-color-adjust:none;transform-origin:0 0;caret-color:CanvasText;z-index:2;--min-font-size:1;--text-scale-factor:calc(var(--total-scale-factor) * var(--min-font-size));--min-font-size-inv:calc(1 / var(--min-font-size))}.pdf-text-layer :is(span,br){color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0 0;user-select:text}.pdf-text-layer>:not(.markedContent),.pdf-text-layer .markedContent span:not(.markedContent){z-index:1;--font-height:0;font-size:calc(var(--text-scale-factor) * var(--font-height));--scale-x:1;--rotate:0deg;transform:rotate(var(--rotate)) scaleX(var(--scale-x)) scale(var(--min-font-size-inv))}.pdf-text-layer .markedContent{display:contents}.pdf-text-layer ::selection{background:rgba(97,78,255,.35);color:transparent}.empty{padding:80px 20px;text-align:center;color:var(--muted)}#file{display:none}@media(max-width:720px){.toolbar{grid-template-columns:1fr auto}.toolbar button:nth-of-type(n+3){grid-row:2}.pages{padding:10px}}
</style></head><body>
<div class="toolbar"><input id="url" placeholder="粘贴 PDF 地址 https://…"/><button id="load">打开 URL</button><button id="choose">打开本地 PDF</button><button id="zoom">缩放 125%</button><input id="file" type="file" accept="application/pdf"/><div id="status" class="status">可打开远程 PDF 或本地 PDF。文本型 PDF 支持与网页相同的划词查询；扫描件暂不支持 OCR。</div></div>
<div id="pages" class="pages"><div class="empty">尚未加载 PDF。</div></div>
<script type="module" src="pdf.js"></script></body></html>
