<!doctype html><html lang="zh-CN" data-theme="dark"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>查词历史</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei UI",sans-serif;color-scheme:dark;--bg:#101014;--panel:#19191f;--field:#23232b;--text:#f3f3f5;--muted:#9696a0;--border:rgba(255,255,255,.10);--accent:#8b7cf6;--danger:#ff7777}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}main{max-width:980px;margin:auto;padding:28px 20px 60px}h1{margin:0 0 6px;font-size:24px}.sub{color:var(--muted);margin-bottom:20px}.toolbar{display:grid;grid-template-columns:1fr auto auto;gap:9px;margin-bottom:16px}input,button{font:inherit;border:0;border-radius:9px;padding:10px 12px}input{background:var(--field);color:var(--text);outline:1px solid var(--border)}button{background:var(--field);color:var(--text);cursor:pointer}.danger{color:var(--danger)}.list{display:flex;flex-direction:column;gap:10px}.item{border:1px solid var(--border);border-radius:12px;background:var(--panel);overflow:hidden}.summary{display:grid;grid-template-columns:minmax(120px,1fr) minmax(160px,2fr) auto;gap:12px;align-items:center;padding:12px 14px;cursor:pointer}.word{font-weight:750;overflow-wrap:anywhere}.meta{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.time{color:var(--muted);font-size:12px;white-space:nowrap}.detail{display:none;border-top:1px solid var(--border);padding:14px}.item.open .detail{display:block}.label{color:var(--muted);font-size:11px;margin:10px 0 4px}.value{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55}.messages{display:flex;flex-direction:column;gap:8px}.bubble{padding:9px 10px;border-radius:9px;background:var(--field);white-space:pre-wrap}.bubble.user{margin-left:12%;background:rgba(139,124,246,.16)}.actions{display:flex;gap:8px;margin-top:13px}.empty{padding:40px;text-align:center;color:var(--muted)}a{color:#b7adff}.load-row{display:flex;justify-content:center;align-items:center;gap:12px;margin:18px 0;color:var(--muted);font-size:12px}#loadMore[hidden]{display:none}
</style></head><body><main><h1>查词历史</h1><div class="sub">历史只保存在当前浏览器本地。</div><div class="toolbar"><input id="search" placeholder="搜索单词、句子、网页标题或回答…"/><button id="refresh">刷新</button><button id="clear" class="danger">清空历史</button></div><div id="list" class="list"></div><div class="load-row"><span id="count"></span><button id="loadMore">加载更多</button></div><script type="module" src="history.js"></script></main></body></html>
